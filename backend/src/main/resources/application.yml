server:
  servlet:
    context-path: /wei
  port: 8082
spring:
  jackson:
    deserialization:
      ACCEPT_EMPTY_STRING_AS_NULL_OBJECT: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/corporate_directory_wei?characterEncoding=utf-8&serverTimezone=GMT
    # 可用环境变量覆盖：DB_USERNAME / DB_PASSWORD
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    spring.datasource.driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource               # 数据库连接池
    druid:
        initial-size: 5 # 初始化连接池大小
        min-idle: 10    # 最小空闲连接数
        max-active: 20 # 最大连接数
        max-wait: 60000 # 获取连接等待超时时间
        validation-query: SELECT 1 # 测试连接
        test-on-borrow: true # 获取连接时测试
        test-while-idle: true # 空闲连接测试
        test-on-return: true # 归还连接测试

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.wei.controller

# knife4j的增强配置，不需要可以不写
knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表

mybatis-plus:
  configuration:
    # Mybatis配置 开启驼峰功能
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 为Mybatis引用实体类自定义别名
  type-aliases-package: com.wei.entity

jwt:
  # 可用环境变量覆盖：JWT_SECRET（生产环境请务必换掉默认值）
  secret: ${JWT_SECRET:ThisIsAVeryStrongSecretKeyThatIsAtLeast64CharactersLongAndSecureEnoughForHS512123!}
  expiration: 86400